<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" font-family="ui-sans-serif,-apple-system,'Segoe UI',system-ui,sans-serif">
  <rect width="760" height="460" rx="12" fill="#f4f2ee"/>
  <text x="30" y="30" font-size="12" fill="#5f5e5a">How VS Code actually renders it — one-line rows, native theme. Left: flat (recommended). Right: grouped alternative.</text>

  <!-- ================= LEFT: FLAT ================= -->
  <g>
    <rect x="30" y="44" width="330" height="380" rx="6" fill="#252526"/>
    <!-- activity bar -->
    <rect x="30" y="44" width="40" height="380" fill="#333333"/>
    <text x="50" y="80" font-size="17" fill="#ffffff" text-anchor="middle">☰</text>
    <text x="50" y="116" font-size="17" fill="#858585" text-anchor="middle">⌕</text>
    <g>
      <rect x="30" y="134" width="2.5" height="30" fill="#ffffff"/>
      <text x="50" y="155" font-size="17" fill="#ffffff" text-anchor="middle">▷</text>
      <circle cx="61" cy="141" r="8" fill="#007acc"/>
      <text x="61" y="145" font-size="10" fill="#ffffff" text-anchor="middle">2</text>
    </g>

    <!-- sidebar title -->
    <text x="84" y="68" font-size="11" fill="#bbbbbb" letter-spacing="1">LOCAL WORKFLOWS</text>

    <!-- WORKFLOWS section -->
    <rect x="70" y="80" width="290" height="22" fill="#2d2d30"/>
    <text x="84" y="95" font-size="11" fill="#cccccc" font-weight="700">⌄ WORKFLOWS</text>
    <g font-size="13" fill="#cccccc">
      <text x="98" y="121">⚙ release-pipeline</text>
      <text x="98" y="143">⚙ ado-work-item</text>
      <text x="98" y="165">☰ Tasks (local.yml)</text>
    </g>

    <!-- SPECS section -->
    <rect x="70" y="178" width="290" height="22" fill="#2d2d30"/>
    <text x="84" y="193" font-size="11" fill="#cccccc" font-weight="700">⌄ SPECS</text>
    <text x="326" y="193" font-size="13" fill="#cccccc">＋</text>
    <text x="344" y="193" font-size="12" fill="#cccccc">⟳</text>

    <!-- local-run specs -->
    <rect x="70" y="204" width="290" height="22" fill="#04395e"/>
    <text x="86" y="220" font-size="12" fill="#e2c08d">◉</text>
    <text x="102" y="220" font-size="13" fill="#ffffff">reopen-approved-spec-phase</text>
    <text x="282" y="220" font-size="11.5" fill="#9d9d9d">⏸ design · 4d</text>

    <g>
      <text x="86" y="242" font-size="12" fill="#75beff">◉</text>
      <text x="102" y="242" font-size="13" fill="#cccccc">mask-secrets-in-logs</text>
      <text x="252" y="242" font-size="11.5" fill="#8c8c8c">implementing · 3/7</text>
    </g>
    <g>
      <text x="86" y="264" font-size="12" fill="#89d185">◉</text>
      <text x="102" y="264" font-size="13" fill="#cccccc">run-identity-status-model</text>
      <text x="272" y="264" font-size="11.5" fill="#8c8c8c">done · 12d</text>
    </g>

    <!-- foreign specs -->
    <g>
      <text x="86" y="286" font-size="12" fill="#8c8c8c">◎</text>
      <text x="102" y="286" font-size="13" fill="#cccccc">expand-implement-stage</text>
      <text x="268" y="286" font-size="11.5" fill="#8c8c8c">3 files</text>
    </g>
    <g>
      <text x="86" y="308" font-size="12" fill="#8c8c8c">◎</text>
      <text x="102" y="308" font-size="13" fill="#cccccc">params-prompt-ui</text>
      <text x="222" y="308" font-size="11.5" fill="#8c8c8c">1 file</text>
    </g>

    <text x="84" y="344" font-size="10.5" fill="#6e6e6e">filled icon + status text = has a local run</text>
    <text x="84" y="360" font-size="10.5" fill="#6e6e6e">outline icon + file count = teammate's spec</text>
    <text x="84" y="376" font-size="10.5" fill="#6e6e6e">selected row: the one waiting at a gate</text>
    <text x="84" y="404" font-size="10.5" fill="#6e6e6e">boundary carried by icon + description style —</text>
    <text x="84" y="418" font-size="10.5" fill="#6e6e6e">no divider exists in a flat native tree</text>
  </g>

  <!-- ================= RIGHT: GROUPED ================= -->
  <g>
    <rect x="400" y="44" width="330" height="380" rx="6" fill="#252526"/>
    <text x="416" y="68" font-size="11" fill="#bbbbbb" letter-spacing="1">LOCAL WORKFLOWS</text>

    <rect x="400" y="80" width="330" height="22" fill="#2d2d30"/>
    <text x="414" y="95" font-size="11" fill="#cccccc" font-weight="700">⌄ SPECS</text>
    <text x="696" y="95" font-size="13" fill="#cccccc">＋</text>
    <text x="714" y="95" font-size="12" fill="#cccccc">⟳</text>

    <!-- group: mine -->
    <text x="416" y="121" font-size="13" fill="#cccccc">⌄ My specs</text>
    <text x="504" y="121" font-size="11.5" fill="#8c8c8c">3</text>
    <g>
      <text x="436" y="143" font-size="12" fill="#e2c08d">◉</text>
      <text x="452" y="143" font-size="13" fill="#cccccc">reopen-approved-spec-phase</text>
    </g>
    <g>
      <text x="436" y="165" font-size="12" fill="#75beff">◉</text>
      <text x="452" y="165" font-size="13" fill="#cccccc">mask-secrets-in-logs</text>
    </g>
    <g>
      <text x="436" y="187" font-size="12" fill="#89d185">◉</text>
      <text x="452" y="187" font-size="13" fill="#cccccc">run-identity-status-model</text>
    </g>

    <!-- group: team -->
    <text x="416" y="213" font-size="13" fill="#cccccc">⌄ Team</text>
    <text x="474" y="213" font-size="11.5" fill="#8c8c8c">2</text>
    <g>
      <text x="436" y="235" font-size="12" fill="#8c8c8c">◎</text>
      <text x="452" y="235" font-size="13" fill="#cccccc">expand-implement-stage</text>
    </g>
    <g>
      <text x="436" y="257" font-size="12" fill="#8c8c8c">◎</text>
      <text x="452" y="257" font-size="13" fill="#cccccc">params-prompt-ui</text>
    </g>

    <g font-size="10.5" fill="#6e6e6e">
      <text x="416" y="300">labeled separation, but:</text>
      <text x="416" y="316">· one more nesting level, one more click</text>
      <text x="416" y="332">· names get less width (indent)</text>
      <text x="416" y="348">· "My/Team" is a claim the tree must defend</text>
      <text x="416" y="364">&#160;&#160;(a run exists ≠ the spec is mine)</text>
      <text x="416" y="392">for a list of 5–15 specs, ceremony —</text>
      <text x="416" y="406">flat is recommended</text>
    </g>
  </g>

  <text x="380" y="446" font-size="11" fill="#8a8983" text-anchor="middle">exact colors, fonts, hover and selection all come from the user's VS Code theme — this sample uses Dark+ values</text>
</svg>
